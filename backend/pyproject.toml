[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "school-erp-backend"
version = "0.1.0"
description = "FastAPI backend for School ERP SaaS"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "DEENDHAYAL RR" }
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "SQLAlchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "greenlet>=3.1.1",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "httpx>=0.27.2",
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.ruff]
# Target Python version
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Enable Pyflakes (F), Pycodestyle (E, W), isort (I), pep8-naming (N), Pydantic (PD)
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # Line length handled by formatter
    "B008", # Do not perform function call Depends in argument defaults
    "N818", # Exception name should be named with an Error suffix
    "E402", # Module level import not at top of file (sys.path append pattern)
    "UP046", # Generic class uses Generic subclass instead of type parameters
    "N802",  # Function name should be lowercase (FastAPI dependency class-like pattern)
    "RUF022", # sorting of __all__
    "B904",  # raise from err in except clauses
    "E741",  # ambiguous variable name 'l'
    "E712",  # avoid comparing to False (required for SQLAlchemy binary expressions)
    "W291",  # trailing whitespace in autogenerated migrations
    "UP042",  # Class inherits from both str and Enum
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["venv", ".venv", "alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::pytest.PytestConfigWarning",
]
